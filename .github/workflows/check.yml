name: Check TimeEdit schedule

on:
  schedule:
    # GitHub cron is UTC. Norway is UTC+1 (winter) / UTC+2 (summer).
    # Morning burst: every 5 min, 06:00-07:30 Oslo time. The two crons cover
    # both DST offsets; the gate step below skips runs outside the local window.
    - cron: "*/5 4-5 * * *"
    - cron: "0-30/5 6 * * *"
    # Baseline: hourly 07:00-17:00 UTC
    - cron: "0 7-17 * * *"
    # Evening check (catches changes posted the night before)
    - cron: "0 19-22 * * *"
  workflow_dispatch:

concurrency:
  group: schedule-check
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Gate morning burst on Oslo local time (handles DST)
        id: gate
        run: |
          if [ "${{ github.event.schedule }}" = "*/5 4-5 * * *" ] || [ "${{ github.event.schedule }}" = "0-30/5 6 * * *" ]; then
            hm=$(TZ=Europe/Oslo date +%H%M)
            if [ "$hm" -lt 600 ] || [ "$hm" -gt 730 ]; then
              echo "Outside the 06:00-07:30 Oslo window (local time $hm), skipping."
              echo "run=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt
        if: steps.gate.outputs.run == 'true'

      - name: Check schedule
        id: check
        if: steps.gate.outputs.run == 'true'
        env:
          TIMEEDIT_URL: "https://cloud.timeedit.net/usn/web/publikk/ri1X5074f9506fQQ6YZYQQ8Y84y1Z106757.html"
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python check_schedule.py

      - name: Commit updated snapshot
        if: always() && steps.gate.outputs.run == 'true'
        run: |
          git config user.name "schedule-bot"
          git config user.email "actions@github.com"
          git add state/snapshot.json
          if ! git diff --cached --quiet; then
            git commit -m "Update schedule snapshot"
            git pull --rebase && git push
          fi
